name: YouTube yt-dlp Basic Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp
          yt-dlp --version

      - name: Test YouTube
        run: |
          set -o pipefail

          yt-dlp \
            --no-playlist \
            --no-warnings \
            --dump-single-json \
            "https://www.youtube.com/watch?v=7VsejGzcJmM" \
            2>&1 | tee yt-test.log

      - name: Show failure log
        if: failure()
        run: |
          echo "===== yt-dlp diagnostic output ====="
          cat yt-test.log
          echo "===================================="
