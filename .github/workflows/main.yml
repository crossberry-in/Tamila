name: YouTube yt-dlp Cookie Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp
          echo "yt-dlp version:"
          yt-dlp --version

      - name: Prepare cookie file
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "ERROR: YT_COOKIES secret is not configured."
            exit 1
          fi

          COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"

          printf '%s\n' "$YT_COOKIES" > "$COOKIE_FILE"
          chmod 600 "$COOKIE_FILE"

          echo "YT_COOKIES_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"

          echo "Cookie file created."
          echo "Line count: $(wc -l < "$COOKIE_FILE")"

      - name: Test YouTube metadata
        run: |
          set -o pipefail

          echo "Testing yt-dlp with cookies..."

          yt-dlp \
            --cookies "$YT_COOKIES_FILE" \
            --no-playlist \
            --no-warnings \
            --dump-single-json \
            "https://www.youtube.com/watch?v=7VsejGzcJmM" \
            2>&1 | tee "$RUNNER_TEMP/yt-test.log"

      - name: Verify result
        if: success()
        run: |
          echo "================================"
          echo "YouTube test: SUCCESS"
          echo "================================"

      - name: Show diagnostic
        if: failure()
        run: |
          echo "================================"
          echo "YouTube test: FAILED"
          echo "================================"

          if [ -f "$RUNNER_TEMP/yt-test.log" ]; then
            cat "$RUNNER_TEMP/yt-test.log"
          fi

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/youtube-cookies.txt"
          rm -f "$RUNNER_TEMP/yt-test.log"

          echo "Temporary credential files removed."
